name: validate

on:
  push:
  pull_request:

jobs:
  audit-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: unit tests
        run: python -B -m unittest discover -s tests -v
      - name: end-to-end CLI smoke
        run: python -B validation/smoke.py
      - name: output contract gate
        run: |
          python scripts/build_tradability_panel.py --demo --min-amount 5e7 --out panel.csv
          python scripts/audit_trades.py --demo --out audit.json --ledger ledger.csv
          python scripts/validate_audit.py audit.json

  qsh-form:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/validate-qsh-form.mjs SKILL.md

  publish-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: refuse to ship an unfilled author placeholder
        run: |
          if grep -rn "GITHUB_USERNAME_TODO" . --exclude-dir=.git; then
            echo "::error::SKILL.md still carries the author placeholder. Replace"
            echo "::error::GITHUB_USERNAME_TODO with the real GitHub username before publishing."
            exit 1
          fi
      - name: refuse to ship a personal email address
        run: |
          if grep -rnE "[A-Za-z0-9._%+-]+@(gmail|qq|163|126|outlook|hotmail)\.com" . --exclude-dir=.git; then
            echo "::error::a personal email address would be published; use a GitHub username instead."
            exit 1
          fi
